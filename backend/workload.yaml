# OpenChoreo workload descriptor for labbook-api (read from the component's appPath at build time).
apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: labbook-api

endpoints:
  - name: api
    port: 8080
    type: HTTP
    visibility:
      - project
      - external
    schemaFile: openapi.yaml

# The Postgres Resource (deploy/openchoreo/resources) publishes its connection details.
# Ballerina reads configurable values from BAL_CONFIG_VAR_<NAME> environment variables.
dependencies:
  resources:
    - ref: labbook-postgres
      envBindings:
        host: BAL_CONFIG_VAR_DBHOST
        port: BAL_CONFIG_VAR_DBPORT
        username: BAL_CONFIG_VAR_DBUSER
        password: BAL_CONFIG_VAR_DBPASSWORD
        database: BAL_CONFIG_VAR_DBNAME

configurations:
  env:
    - name: BAL_CONFIG_VAR_DBSSLMODE
      value: "disable"
    # Sign-in is handled by ThunderID: the SPA sends its access token as "Authorization: Bearer".
    - name: BAL_CONFIG_VAR_DEVMODE
      value: "false"
    - name: BAL_CONFIG_VAR_JWTHEADER
      value: "Authorization"
    - name: BAL_CONFIG_VAR_JWTISSUER
      value: "http://thunder.openchoreo.localhost:8080"
    - name: BAL_CONFIG_VAR_JWTJWKSURL
      value: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/jwks"
    # Users with these emails get the admin role (OpenChoreo default admin user).
    - name: BAL_CONFIG_DATA
      value: 'adminEmails = ["admin@openchoreo.dev"]'
