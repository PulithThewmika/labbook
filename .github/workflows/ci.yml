name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  BALLERINA_VERSION: "2201.14.2"
  # Local-only credentials for the throwaway service container (same as .env.example)
  DATABASE_URL: postgresql://labbook:labbook_local@localhost:5432/labbook

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: labbook
          POSTGRES_USER: labbook
          POSTGRES_PASSWORD: labbook_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labbook -d labbook"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: bash scripts/migrate.sh
      - uses: ballerina-platform/setup-ballerina@v1
        with:
          version: ${{ env.BALLERINA_VERSION }}
      - name: Build
        working-directory: backend
        run: bal build
      - name: Test (unit + integration)
        working-directory: backend
        run: bal test

  scheduler:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: labbook
          POSTGRES_USER: labbook
          POSTGRES_PASSWORD: labbook_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labbook -d labbook"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: bash scripts/migrate.sh
      - uses: ballerina-platform/setup-ballerina@v1
        with:
          version: ${{ env.BALLERINA_VERSION }}
      - name: Build
        working-directory: scheduler
        run: bal build
      - name: Test
        working-directory: scheduler
        run: bal test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
