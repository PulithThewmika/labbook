services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: labbook
      POSTGRES_USER: labbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    ports:
      - "5432:5432"
    volumes:
      - labbook-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labbook -d labbook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  labbook-pgdata:
