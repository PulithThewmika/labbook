# The three LabBook components, built from this repository on GitHub (branch main).
# Each component reads its workload.yaml from its own directory.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: labbook-api
  namespace: default
spec:
  owner:
    projectName: labbook
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/PulithThewmika/labbook"
        revision:
          branch: "main"
        appPath: "/backend"
      docker:
        context: "/backend"
        filePath: "/backend/Dockerfile"
---
apiVersion: openchoreo.dev/v1alpha1
kind: WorkflowRun
metadata:
  name: labbook-api-build-03
  labels:
    openchoreo.dev/project: "labbook"
    openchoreo.dev/component: "labbook-api"
spec:
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/PulithThewmika/labbook"
        revision:
          branch: "main"
        appPath: "/backend"
      docker:
        context: "/backend"
        filePath: "/backend/Dockerfile"
---
